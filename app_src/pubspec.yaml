name: prowalkie
description: ProWalkie push-to-talk
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  agora_rtc_engine: ^6.3.2
  agora_token_service: ^0.1.2
  audioplayers: ^6.1.0
  permission_handler: ^11.3.1
flutter:
  uses-material-design: true
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-500.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-600.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-700.ttf
          weight: 700
    - family: Andika
      fonts:
        - asset: assets/fonts/Andika-400.ttf
          weight: 400
        - asset: assets/fonts/Andika-700.ttf
          weight: 700
